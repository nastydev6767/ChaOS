name: Validate ChaOS VM PowerShell

on:
  push:
    paths:
      - "chaos/vm/**"
      - ".github/workflows/validate-chaos-vm.yml"
  pull_request:
    paths:
      - "chaos/vm/**"
      - ".github/workflows/validate-chaos-vm.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Parse scripts and verify safety invariants
        shell: pwsh
        run: ./chaos/vm/tests/Test-ChaOSVmScripts.ps1
